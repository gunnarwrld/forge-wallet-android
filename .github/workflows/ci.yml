name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kotlin compiler warnings fail the build in CI.
  ORG_GRADLE_PROJECT_warningsAsErrors: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (ktlint, detekt, Android Lint)
        run: ./gradlew ktlintCheck detekt lintDebug --continue

      - name: Unit tests (JVM and Robolectric)
        run: ./gradlew unitTest --continue

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            **/build/reports
            **/build/test-results

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: forge-wallet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
